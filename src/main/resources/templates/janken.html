<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>じゃんけん</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>

  <h1>じゃんけん勝負</h1>
  <!-- ログインユーザ名を表示する -->
  <p th:if="${username}">Hi [[${username}]]</p>

  <!-- エントリーしている全ユーザを表示する -->
  <div th:if="${entry}">
    <h2>エントリー</h2>
    <p>今[[${entry.userCount}]]人がエントリーしています</p>
    <ul>
      <li th:each="user : ${entry.users}">[[${user}]]</li>
    </ul>
  </div>

  <p>手を選んでください</p>
  <!-- クエリパラメータhandで選んだ手を/jankengameにGETで渡す -->
  <a href="/jankengame?hand=Gu">グー</a>
  <a href="/jankengame?hand=Choki">チョキ</a>
  <a href="/jankengame?hand=Pa">パー</a>

  <!-- 対戦結果(janken)が渡されたときだけ表示する -->
  <div th:if="${janken}">
    <p>あなたの手：[[${janken.playerHand}]]</p>
    <p>相手の手：[[${janken.cpuHand}]]</p>
    <p>結果：[[${janken.result}]]</p>
  </div>
</body>

</html>
