<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>じゃんけん</title>
</head>

<body>
  <h1>相手を選んでじゃんけん</h1>
  <!-- ログインユーザと対戦相手の名前を表示する(例: ほんだ vs CPU) -->
  <p>[[${username}]] vs [[${opponent.name}]]</p>

  <p>手を選んでください</p>
  <!-- 選んだ手(hand)と対戦相手のid(id)を/fightにGETで渡す．相手がCPU以外ならwait.htmlに遷移して相手の手を待つ -->
  <a th:href="@{/fight(hand=Gu,id=${opponent.id})}">グー</a>
  <a th:href="@{/fight(hand=Choki,id=${opponent.id})}">チョキ</a>
  <a th:href="@{/fight(hand=Pa,id=${opponent.id})}">パー</a>

  <!-- 試合結果(janken)が渡されたときだけ両者の手と勝敗を表示する -->
  <div th:if="${janken}">
    <p>あなたの手：[[${janken.playerHand}]]</p>
    <p>相手の手：[[${janken.cpuHand}]]</p>
    <p>結果：[[${janken.result}]]</p>
  </div>

  <a href="/janken">もどる</a>
</body>

</html>
